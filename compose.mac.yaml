# Standalone Apple Silicon setup; requires Docker Model Runner enabled.
name: kybele-middle-mac
services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile.mac
    platform: linux/arm64
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?Set VLLM_API_KEY in .env}
      MODEL_URL: http://model-runner.docker.internal/engines/llama.cpp/v1
      MODEL_ID: ${MAC_MODEL:-hf.co/Qwen/Qwen3-0.6B-GGUF:Q8_0}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 10m
      retries: 5
